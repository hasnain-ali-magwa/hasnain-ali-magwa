<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>

    <!-- Noise/grain pattern -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Clip for red glitch slices -->
    <clipPath id="gc1">
      <rect x="0" width="800">
        <animate attributeName="y"
                 values="10;45;8;72;22;55;12;83;30;62;18;48;10"
                 dur="3s" repeatCount="indefinite"/>
        <animate attributeName="height"
                 values="22;12;28;8;18;22;14;10;25;8;20;14;22"
                 dur="3s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- Clip for cyan glitch slices -->
    <clipPath id="gc2">
      <rect x="0" width="800">
        <animate attributeName="y"
                 values="55;22;73;12;65;32;84;18;50;68;40;58;55"
                 dur="2.7s" repeatCount="indefinite"/>
        <animate attributeName="height"
                 values="16;26;9;22;13;20;11;24;16;9;18;12;16"
                 dur="2.7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- Clip for white flash slice (rare) -->
    <clipPath id="gc3">
      <rect x="0" width="800">
        <animate attributeName="y"
                 values="100;35;100;100;60;100;100;40;100;100;25;100;100"
                 dur="5s" repeatCount="indefinite"/>
        <animate attributeName="height"
                 values="0;4;0;0;3;0;0;5;0;0;3;0;0"
                 dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

  </defs>

  <!-- Dark background -->
  <rect width="800" height="120" fill="#0d1117" rx="8"/>

  <!-- Subtle grid lines (atmosphere) -->
  <line x1="0" y1="30" x2="800" y2="30" stroke="#00ff8808" stroke-width="1"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#00ff8808" stroke-width="1"/>
  <line x1="0" y1="90" x2="800" y2="90" stroke="#00ff8808" stroke-width="1"/>

  <!-- ═══ BASE TEXT — Neon Green ═══ -->
  <text x="400" y="76" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="54" font-weight="900"
        fill="#00ff88" letter-spacing="5">
    HASNAIN ALI MAGWA
    <!-- Subtle flicker -->
    <animate attributeName="opacity"
             values="1;1;1;0.88;1;1;0.92;1;0.72;1;1;0.95;1;1;0.8;1;1"
             dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- ═══ RED GLITCH LAYER ═══ -->
  <g clip-path="url(#gc1)">
    <animateTransform attributeName="transform" type="translate"
                      values="0,0;-7,0;0,0;-10,2;0,0;0,0;-6,-1;0,0;-9,1;0,0;-5,0;0,0"
                      dur="3s" repeatCount="indefinite"/>
    <text x="400" y="76" text-anchor="middle"
          font-family="'Courier New', Courier, monospace"
          font-size="54" font-weight="900"
          fill="#ff0055" opacity="0.92" letter-spacing="5">
      HASNAIN ALI MAGWA
    </text>
  </g>

  <!-- ═══ CYAN GLITCH LAYER ═══ -->
  <g clip-path="url(#gc2)">
    <animateTransform attributeName="transform" type="translate"
                      values="0,0;7,0;0,0;10,-2;0,0;0,0;6,1;0,0;9,-1;0,0;5,0;0,0"
                      dur="2.7s" repeatCount="indefinite"/>
    <text x="400" y="76" text-anchor="middle"
          font-family="'Courier New', Courier, monospace"
          font-size="54" font-weight="900"
          fill="#00e5ff" opacity="0.92" letter-spacing="5">
      HASNAIN ALI MAGWA
    </text>
  </g>

  <!-- ═══ WHITE FLASH GLITCH (rare burst) ═══ -->
  <g clip-path="url(#gc3)">
    <text x="400" y="76" text-anchor="middle"
          font-family="'Courier New', Courier, monospace"
          font-size="54" font-weight="900"
          fill="#ffffff" opacity="0.95" letter-spacing="5">
      HASNAIN ALI MAGWA
    </text>
  </g>

  <!-- ═══ MOVING SCANLINE ═══ -->
  <rect x="0" width="800" height="2" fill="#00ff88">
    <animate attributeName="y" values="-2;122;-2" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.3;0.4;0.1;0" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ HORIZONTAL GLITCH BAR (fast random flash) ═══ -->
  <rect x="0" width="800" height="3" fill="#ff005533">
    <animate attributeName="y" values="120;28;120;120;65;120;120;42;120;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0;0;0.4;0;0;0.5;0;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="800;600;800;800;700;800;800;650;800;800" dur="4s" repeatCount="indefinite"/>
  </rect>

</svg>
